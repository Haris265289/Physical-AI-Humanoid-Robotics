name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or 'master' depending on your default branch
  pull_request:
    branches:
      - main  # or 'master' depending on your default branch

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AI-TextBook/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: AI-TextBook

      - name: Build website
        run: npm run build
        working-directory: AI-TextBook

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./AI-TextBook/build
          # The following lines create a push to the gh-pages branch
          publish_branch: gh-pages
